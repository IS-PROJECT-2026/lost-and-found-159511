<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guard Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Guard Login</h1>
        <p>Access the lost and found management system</p>
        <a href="index.html">← Back to Student View</a>
    </header>

    <main>
        <section class="form-container">
            <h2>Login</h2>
            <form id="loginForm">
                <label>Email</label>
                <input id="email" type="email" placeholder="guard@university.com" required>

                <label>Password</label>
                <input id="password" type="password" placeholder="Enter password" required>

                <button type="submit">Login</button>
            </form>
            
            <p style="text-align: center; margin-top: 15px;">
                Don't have an account? <a href="register.html" style="color: #333; font-weight: bold;">Register here</a>
            </p>
            
            <p id="loginError" style="color:red; display:none; text-align:center;">Invalid email or password!</p>
        </section>
    </main>

    <footer>
        <p>Guard Portal</p>
    </footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Get registered guards from localStorage
            const guards = JSON.parse(localStorage.getItem("guards")) || [];
            
            // Check if credentials match any registered guard
            const found = guards.find(g => g.email === email && g.password === password);
            
            if (found) {
                localStorage.setItem("loggedInGuard", JSON.stringify(found));
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        });
    </script>
</body>

</html>
