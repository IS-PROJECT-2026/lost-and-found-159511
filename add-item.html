<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Lost Item</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<h1>Register Found Item</h1>

<p>
Guard item reporting portal
</p>

</header>



<main>


<section class="form-container">


<h2>Item Details</h2>


<form>


<label>
Item Name
</label>

<input type="text" placeholder="Enter item name">



<label>
Category
</label>

<input type="text" placeholder="Bag, Phone, ID etc.">



<label>
Description
</label>

<textarea placeholder="Describe the item"></textarea>



<label>
Found Location
</label>

<input type="text" placeholder="Where was it found?">



<label>
Lost & Found Office
</label>

<input type="text" placeholder="Which office stores it?">



<label>
Date Found
</label>

<input type="date">



<label>
Status
</label>

<select>

<option>
Available
</option>

<option>
Collected
</option>

</select>


<br><br>


<button type="submit">
Submit Item
</button>


</form>


</section>


</main>



<script src="js/app.js"></script>


</body>

</html>
