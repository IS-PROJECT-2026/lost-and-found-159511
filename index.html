<!DOCTYPE html>
<html>

<head>
    <title>University Lost and Found</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>University Lost and Found</h1>
        <p>Helping students locate lost items</p>
        <a href="Guard.html">Guard Login</a>
    </header>

    <main>
        <section>
            <h2>Available Lost & Found Items</h2>
            
            <div style="margin: 20px 0;">
                <input 
                    id="searchInput" 
                    type="text" 
                    placeholder="Search items..." 
                    onkeyup="searchItems()"
                    style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 5px; font-size: 16px;"
                >
            </div>

            <div class="items-container" id="items-container">
                <!-- Items will appear here -->
            </div>
        </section>
    </main>

    <footer>
        <p>Lost & Found System</p>
    </footer>

    <script src="js/app.js"></script>
</body>

</html>
